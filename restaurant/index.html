<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ember & Salt — Fine Dining</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"Playfair Display"', 'serif'],
              body: ['Jost', 'sans-serif'],
            },
            colors: {
              cream: {
                50: '#fdfcf9',
                100: '#f9f5ef',
                200: '#f2ebe0',
                300: '#e8ddd0',
                400: '#d4c4b0',
                500: '#b8a090',
              },
              stone: {
                850: '#1c1917',
              },
              gold: {
                300: '#d4af7a',
                400: '#c49a5c',
                500: '#a8782e',
                600: '#8b5e1a',
              },
            },
          },
        },
      };
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { background: #fdfcf9; color: #1c1917; font-family: 'Jost', sans-serif; overflow-x: hidden; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #f2ebe0; }
      ::-webkit-scrollbar-thumb { background: #a8782e; border-radius: 2px; }
      input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.4; cursor: pointer; }
      select option { background: #fff; color: #1c1917; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
